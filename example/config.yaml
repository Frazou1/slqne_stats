name: SLQNE Hockey Stats
version: "1.8.1"
slug: slqne_hockey_stats
description: >
  Récupère et publie via MQTT les statistiques de la SLQNE (classements, joueurs, gardiens)
  à partir du site Spordle (ligue de hockey mineur Capitale-Nationale).
url: "https://github.com/Frazou1/slqne_hockey"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
map:
  - share:rw

options:
  entity_prefix: "slqne"
  teams:
    - name: "joueur1 Hockey"
      spordle_url: "https://page.spordle.com/fr/ligue-hockey-mineur-capitale-nationale/classement/000002?organizationId=00000000-0000-0000-0000-000000000002"
    - name: "joueur2 Hockey"
      league_id: "00000000-0000-0000-0000-000000000001"
      schedule_id: "000003"

  # 🧩 joueurs suivis (override possible par joueur via spordle_url, league_id ou schedule_id)
  players:
    - player_name: "joueur1 Joueur"
      team_name: "joueur1 Hockey"
    - player_name: "joueur2 Joueur"
      team_name: "joueur2 Hockey"

  update_interval: 7200  # toutes les 2 heures
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: "monuser"
  mqtt_password: "monpassword"
  discovery_prefix: "homeassistant"

schema:
  entity_prefix: str?
  teams:
    - name: str
      spordle_url: str?    # ← Nouveau : Lien direct Spordle ou RSEQ
      league_id: str?      # ← Devient optionnel si spordle_url est fourni
      schedule_id: str?    # ← Devient optionnel si spordle_url est fourni
  players:
    - player_name: str
      team_name: str
      spordle_url: str?    # ← Permet l'override par URL au niveau du joueur
      league_id: str?      # ← Autorisé (override par joueur)
      schedule_id: str?    # ← Autorisé (override par joueur)
  update_interval: int(30,86400)
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str
  mqtt_password: str
  discovery_prefix: str
