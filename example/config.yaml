name: SLQNE Hockey Stats
version: "1.8.10"
slug: slqne_hockey_stats
description: >
  Récupère et publie via MQTT les statistiques de la SLQNE (classements, joueurs, gardiens)
  à partir du site Spordle (ligue de hockey mineur Capitale-Nationale).
url: "https://github.com/Frazou1/slqne_stats"
arch:
  - aarch64
  - amd64
init: false
shm: true
map:
  - share:rw

options:
  entity_prefix: "slqne"
  teams:
    - name: "Mon équipe"
      spordle_url: "https://page.spordle.com/<ligue>/teams/<identifiant>"

  players: []

  update_interval: 7200
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: "monuser"
  mqtt_password: "monpassword"
  discovery_prefix: "homeassistant"

schema:
  entity_prefix: str?
  teams:
    - name: str
      spordle_url: str?
      league_id: str?
      schedule_id: str?
  players:
    - player_name: str
      team_name: str
      spordle_url: str?
      league_id: str?
      schedule_id: str?
  update_interval: int(30,86400)
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str
  mqtt_password: str
  discovery_prefix: str
